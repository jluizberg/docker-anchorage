services:
  nginx:
    image: nginx:1.26-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ${NGINX_DATA_DIR}/nginx.conf:${NGINX_BASE_DIR}/nginx.conf:ro
      - ${NGINX_DATA_DIR}/conf.d:${NGINX_BASE_DIR}/conf.d:ro
      - ${GLOBAL_JBDESIGN_CERTS_DIR}:${NGINX_CERTS_DIR}:ro
      - ${NGINX_DATA_DIR}/logs:/var/log/nginx
    networks:
      - ${GLOBAL_BRIDGED_NETWORK}

  proget:
    image: proget.inedo.com/productimages/inedo/proget:latest
    container_name: proget
    restart: unless-stopped
    privileged: true
    volumes:
      - ${PROGET_DATA_DIR}/packages:/var/proget/packages
      - ${PROGET_DATA_DIR}/database:/var/proget/database
      - ${PROGET_DATA_DIR}/backups:/var/proget/backups
    networks:
      - ${GLOBAL_BRIDGED_NETWORK}
    depends_on:
      - nginx

  # rancher:
  #   image: rancher/rancher:latest
  #   container_name: ${RANCHER_CONTAINER_NAME}
  #   restart: unless-stopped
  #   privileged: true
  #   ports:
  #     - "3443:443"
  #   volumes:
  #     - ${RANCHER_DATA_DIR}:/var/lib/rancher
  #     - ${GLOBAL_JBDESIGN_CERTS_DIR}/${LETSENCRYPT_CERT_FILE}:/etc/rancher/ssl/cert.pem
  #     - ${GLOBAL_JBDESIGN_CERTS_DIR}/${LETSENCRYPT_CERT_KEY}:/etc/rancher/ssl/key.pem
  #   networks:
  #     - ${GLOBAL_BRIDGED_NETWORK}
  #   environment:
  #     - CATTLE_AGENT_TLS_MODE=system-store
  #   command: 
  #     - "--no-cacerts"
  #   depends_on:
  #     - nginx

  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${POSTGRES_DATA_DIR}:/var/lib/postgresql/data
      - ${GLOBAL_JBDESIGN_CERTS_DIR}:/ssl:ro
      - ./postgres/init-ssl.sh:/docker-entrypoint-initdb.d/ssl.sh:ro
    networks:
      - ${GLOBAL_BRIDGED_NETWORK}

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: ${KEYCLOAK_CONTAINER_NAME}
    restart: unless-stopped
    command: start
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://${POSTGRES_CONTAINER_NAME}:5432/${KEYCLOAK_DB}?sslmode=require
      - KC_DB_USERNAME=${KEYCLOAK_DB_USER}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
    volumes:
      - ${KEYCLOAK_DATA_DIR}:/opt/keycloak/data
    networks:
      - ${GLOBAL_BRIDGED_NETWORK}
    depends_on:
      - nginx
      - postgres

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ${QDRANT_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=${QDRANT_GRPC_PORT}
      - QDRANT__API_KEY=${QDRANT_API_KEY}
    volumes:
      - ${QDRANT_DATA_DIR}:/qdrant/storage
    networks:
      - ${GLOBAL_BRIDGED_NETWORK}
    depends_on:
      - nginx

  # websearch:
  #   image: proget.intra.jbdesign.com.br/containers/web-search:latest
  #   container_name: ${WEBSEARCH_CONTAINER_NAME}
  #   restart: unless-stopped
  #   ports:
  #     - "4000:4000"
  #     - "3001:3001"
  #   volumes:
  #     - ${WEBSEARCH_DATA_DIR}/config.json:/app/config.json:ro
  #   networks:
  #     - ${GLOBAL_BRIDGED_NETWORK}
  #   depends_on:
  #     - nginx
  #     - postgres
  #     - qdrant

  translator:
    image: ${TRANSLATOR_IMAGE}
    container_name: ${TRANSLATOR_CONTAINER_NAME}
    restart: unless-stopped
    # Resource caps keep LibreTranslate from consuming the whole dev box without
    # overriding its default command (which is required for translations to work).
    mem_limit: 8g
    cpus: 4
    environment:
      # Only the most common content languages are pre-loaded; other models are
      # fetched on demand, keeping the resident model set (and memory) small.
      - LT_LOAD_ONLY=en,pt,es,fr,it,de,ru
      - TRANSLATOR_API_KEY=${TRANSLATOR_API_KEY}
    volumes:
      - ${TRANSLATOR_DATA_DIR}:/app/data
    networks:
      - ${GLOBAL_BRIDGED_NETWORK}
    depends_on:
      - nginx

networks:
  internal:
    name: ${GLOBAL_BRIDGED_NETWORK}
    driver: bridge
    external: true
