server {
    listen 443 ssl;
    http2 on;
    server_name nuget.dev.internal;

    # SSL certificates - using your localhost-dev files
    ssl_certificate /etc/nginx/certs/localhost-dev.crt;
    ssl_certificate_key /etc/nginx/certs/localhost-dev.key;

    # Logging for this server block
    access_log /var/log/nginx/proget_access.log;
    error_log /var/log/nginx/proget_error.log;

    client_max_body_size 2G;

    # Proxy settings for ProGet
    location / {
        proxy_pass http://proget:80;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ProGet specific headers
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        
        # Timeouts (adjust as needed)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    # Optional: Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}