server {
    listen 443 ssl;
    http2 on;
    server_name $KEYCLOAK_APP_INTRA_PATH $KEYCLOAK_APP_PUBLIC_PATH;

    access_log /var/log/nginx/keycloak_access.log combined;
    error_log /var/log/nginx/keycloak_error.log debug;

    resolver 127.0.0.11 valid=10s;
    set $keycloak_upstream $KEYCLOAK_CONTAINER_NAME;

    location / {
        proxy_pass http://$keycloak_upstream:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        include /etc/nginx/conf.d/use-default-headers.inc;
        include /etc/nginx/conf.d/use-default-timeouts.inc;
    }

    include /etc/nginx/conf.d/use-healthcheck.inc;
}