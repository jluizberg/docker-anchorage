server {
    listen 443 ssl;
    http2 on;
    server_name $QDRANT_APP_INTRA_PATH $QDRANT_APP_PUBLIC_PATH;

    access_log /var/log/nginx/qdrant_access.log combined;
    error_log /var/log/nginx/qdrant_error.log debug;

    location / {
        proxy_pass http://$QDRANT_CONTAINER_NAME:6333;
        
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header api-key $QDRANT_API_KEY;

        include /etc/nginx/conf.d/use-default-headers.inc;
        include /etc/nginx/conf.d/use-default-timeouts.inc;
    }

    include /etc/nginx/conf.d/use-healthcheck.inc;
}
