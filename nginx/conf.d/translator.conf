server {
    listen 443 ssl;
    http2 on;
    server_name $TRANSLATOR_APP_INTRA_PATH $TRANSLATOR_APP_PUBLIC_PATH;

    access_log /var/log/nginx/translator_access.log combined;
    error_log /var/log/nginx/translator_error.log debug;

    client_max_body_size 50M;

    location / {
        proxy_pass http://$TRANSLATOR_CONTAINER_NAME:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        include /etc/nginx/conf.d/use-default-headers.inc;
        include /etc/nginx/conf.d/use-default-timeouts.inc;
    }

    include /etc/nginx/conf.d/use-healthcheck.inc;
}
