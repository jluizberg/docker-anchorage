server {
    listen 443 ssl;
    server_name $RANCHER_APP_INTRA_PATH $RANCHER_APP_PUBLIC_PATH;

    # Logging for this server block
    access_log /var/log/nginx/rancher_access.log combined;
    error_log /var/log/nginx/rancher_error.log debug;

    location / {
        proxy_pass http://$RANCHER_CONTAINER_NAME:80;
        
        # REQUIRED for Rancher
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        include /etc/nginx/conf.d/use-default-headers.inc;

        # Timeouts (adjust as needed)
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        keepalive_timeout 3600s;

        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
    }

    include /etc/nginx/conf.d/use-healthcheck.inc;
}
