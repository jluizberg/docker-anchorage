server {
    listen 443 ssl;
    http2 on;
    server_name $NEO4J_APP_INTRA_PATH $NEO4J_APP_PUBLIC_PATH;

    access_log /var/log/nginx/neo4j_access.log combined;
    error_log /var/log/nginx/neo4j_error.log debug;

    location / {
        proxy_pass http://$NEO4J_CONTAINER_NAME:7474;

        # Host and forwarding headers come from use-default-headers.inc; setting
        # Host here as well would send a duplicate Host header, which Neo4j's
        # HTTP server rejects with HTTP 400.
        include /etc/nginx/conf.d/use-default-headers.inc;
        include /etc/nginx/conf.d/use-default-timeouts.inc;
    }

    include /etc/nginx/conf.d/use-healthcheck.inc;
}
